<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Skills — SkillSwap</title>
    <meta name="description" content="Browse skills offered by SkillSwap community members, filter by category and level, and send exchange requests." />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body data-page="explore">
    <div class="app-shell">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="app-sidebar" id="workspaceSidebar" aria-label="Workspace sidebar"></aside>

      <div class="app-main">
        <header class="app-topbar" id="workspaceTopbar"></header>

        <main class="app-content">
          <section class="welcome-banner">
            <div>
              <h1>Explore Skills & Partners</h1>
              <p>Search by skill, filter by experience level, and send a mutual swap proposal.</p>
            </div>
            <a href="exchanges.html" class="btn btn-secondary">My Exchanges</a>
          </section>

          <section class="explore-toolbar" aria-label="Skill filters">
            <div class="explore-search-row">
              <div class="search-input-wrap">
                <span class="search-input-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </span>
                <label class="sr-only" for="exploreSearchInput">Search skills or partners</label>
                <input
                  id="exploreSearchInput"
                  type="search"
                  class="form-input"
                  placeholder="Search by skill, topic, or partner name (e.g., Python, Figma, Video)..."
                />
              </div>

              <div>
                <label class="sr-only" for="exploreLevelSelect">Filter by skill level</label>
                <select id="exploreLevelSelect" class="form-select">
                  <option value="All">All Levels</option>
                  <option value="Beginner">Beginner</option>
                  <option value="Intermediate">Intermediate</option>
                  <option value="Advanced">Advanced</option>
                </select>
              </div>

              <div>
                <label class="sr-only" for="exploreSortSelect">Sort partners</label>
                <select id="exploreSortSelect" class="form-select">
                  <option value="popularity">Sort: Popularity</option>
                  <option value="rating">Sort: Highest Rated</option>
                  <option value="name">Sort: Name (A–Z)</option>
                </select>
              </div>
            </div>

            <div class="filter-tabs" id="exploreCategoryTabs" role="group" aria-label="Skill category filters"></div>
          </section>

          <div class="results-bar">
            <span id="exploreResultsCount">Loading partners...</span>
          </div>

          <section class="partners-grid" id="exploreSkillsGrid" aria-label="Skill partner listings"></section>
        </main>
      </div>
    </div>

    <script type="module" src="/js/explore.js"></script>
  </body>
</html>
